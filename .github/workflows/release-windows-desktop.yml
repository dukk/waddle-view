# Windows desktop release bundle (x64 or arm64). Callable from release.yml and ci.yml.
name: Release build — Windows desktop

on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
        description: 'x64 or arm64'
      build_number:
        type: string
        required: true
      dist_basename:
        type: string
        required: false
        default: ''
      artifact_name:
        type: string
        required: false
        default: ''

defaults:
  run:
    working-directory: apps/waddle_display

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 30
    env:
      WIN_ARCH: ${{ inputs.arch }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        if: ${{ inputs.arch != 'arm64' }}
        with:
          flutter-version: '3.41.9'
          channel: stable
      - name: Install Flutter SDK (arm64)
        if: ${{ inputs.arch == 'arm64' }}
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.41.9 https://github.com/flutter/flutter.git "$env:USERPROFILE\flutter"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\flutter\bin"
      - run: flutter pub get
        working-directory: ${{ github.workspace }}
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: ${{ github.workspace }}/packages/waddle_shared
      - run: flutter build windows --release --build-number "${{ inputs.build_number }}"
      - name: Build waddlectl CLI
        working-directory: ${{ github.workspace }}/apps/waddlectl
        run: dart build cli -o build/waddlectl_release
      - name: Merge waddlectl into Windows Release bundle
        shell: pwsh
        working-directory: ${{ github.workspace }}/apps/waddle_display
        run: |
          $releaseDir = "build/windows/$env:WIN_ARCH/runner/Release"
          $src = "${{ github.workspace }}/apps/waddlectl/build/waddlectl_release/bundle"
          if (-not (Test-Path "$src/bin/waddlectl.exe")) { throw "Missing $src/bin/waddlectl.exe" }
          $dst = Join-Path $releaseDir "waddlectl"
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Path (Join-Path $src "*") -Destination $dst -Recurse
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/waddle_controller/package-lock.json
      - name: Lint, test, coverage, and build waddle_controller SPA
        working-directory: ${{ github.workspace }}/apps/waddle_controller
        run: npm ci && npm run lint && npm run test:coverage && npm run coverage:check && npm run build
      - name: Merge waddle_controller into Windows Release bundle
        shell: pwsh
        working-directory: ${{ github.workspace }}/apps/waddle_display
        run: |
          $releaseDir = "build/windows/$env:WIN_ARCH/runner/Release"
          $src = "${{ github.workspace }}/apps/waddle_controller/dist"
          if (-not (Test-Path "$src/index.html")) { throw "Missing waddle_controller dist at $src" }
          $dst = Join-Path $releaseDir "waddle_controller"
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Path (Join-Path $src "*") -Destination $dst -Recurse
      - name: Package dist
        shell: pwsh
        env:
          DIST_BASENAME_INPUT: ${{ inputs.dist_basename }}
        run: |
          if ($env:DIST_BASENAME_INPUT) {
            $distName = $env:DIST_BASENAME_INPUT
          } elseif ($env:WIN_ARCH -eq 'arm64') {
            $distName = "waddle-view-windows-arm64-${{ github.ref_name }}"
          } else {
            $distName = "waddle-view-windows-x64-${{ github.ref_name }}"
          }
          $releaseDir = "build/windows/$env:WIN_ARCH/runner/Release"
          if (-not (Test-Path "$releaseDir/waddle_display.exe")) { throw "Missing $releaseDir/waddle_display.exe" }
          if (-not (Test-Path "$releaseDir/waddlectl/bin/waddlectl.exe")) { throw "Missing $releaseDir/waddlectl/bin/waddlectl.exe" }
          if (-not (Test-Path "$releaseDir/waddle_controller/index.html")) { throw "Missing $releaseDir/waddle_controller/index.html" }
          New-Item -ItemType Directory -Force "../../dist" | Out-Null
          $zip = "../../dist/$distName.zip"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zip -Force
      - name: Resolve artifact name
        id: artifact
        shell: bash
        env:
          ARTIFACT_NAME_INPUT: ${{ inputs.artifact_name }}
          WIN_ARCH: ${{ inputs.arch }}
        run: |
          if [[ -n "$ARTIFACT_NAME_INPUT" ]]; then
            echo "name=$ARTIFACT_NAME_INPUT" >> "$GITHUB_OUTPUT"
          elif [[ "$WIN_ARCH" == "arm64" ]]; then
            echo "name=windows-arm64-bundle-${{ inputs.build_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=windows-x64-bundle-${{ inputs.build_number }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ github.workspace }}/dist/*.zip
