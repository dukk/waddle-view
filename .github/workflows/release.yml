# Desktop (Windows/Linux x64+arm64), Pi arm64, mobile compile, controller Docker; GitHub Release on v* tags.
# Reusable: release-windows-desktop, release-linux-desktop, release-pi, release-android, release-ios, release-macos, release-controller-docker.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-windows-desktop.yml
    with:
      arch: x64
      build_number: ${{ github.run_number }}

  # Flutter 3.41.9 on windows-11-arm is best-effort (continue-on-error inside desktop workflow).
  windows-arm64:
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-windows-desktop.yml
    with:
      arch: arm64
      build_number: ${{ github.run_number }}

  linux-x64:
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-linux-desktop.yml
    with:
      arch: x64
      build_number: ${{ github.run_number }}

  linux-arm64-desktop:
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-linux-desktop.yml
    with:
      arch: arm64
      build_number: ${{ github.run_number }}

  pi:
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-pi.yml
    with:
      build_number: ${{ github.run_number }}

  android:
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-android.yml
    with:
      build_number: ${{ github.run_number }}

  ios:
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-ios.yml
    with:
      build_number: ${{ github.run_number }}

  macos:
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-macos.yml
    with:
      build_number: ${{ github.run_number }}

  controller-docker:
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-controller-docker.yml
    with:
      build_number: ${{ github.run_number }}
      artifact_name: release-controller-docker-${{ github.run_number }}

  publish:
    needs:
      - windows-x64
      - windows-arm64
      - linux-x64
      - linux-arm64-desktop
      - pi
      - android
      - ios
      - macos
      - controller-docker
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: windows-x64-bundle-${{ github.run_number }}
          path: release-assets
      - uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: windows-arm64-bundle-${{ github.run_number }}
          path: release-assets
      - uses: actions/download-artifact@v6
        with:
          name: linux-x64-bundle-${{ github.run_number }}
          path: release-assets
      - uses: actions/download-artifact@v6
        with:
          name: linux-arm64-desktop-bundle-${{ github.run_number }}
          path: release-assets
      - uses: actions/download-artifact@v6
        with:
          name: linux-arm64-bundle-${{ github.run_number }}
          path: release-assets
      - uses: actions/download-artifact@v6
        with:
          name: android-bundle-${{ github.run_number }}
          path: release-assets
      - uses: actions/download-artifact@v6
        with:
          name: ios-bundle-${{ github.run_number }}
          path: release-assets
      - uses: actions/download-artifact@v6
        with:
          name: macos-bundle-${{ github.run_number }}
          path: release-assets
      - uses: actions/download-artifact@v6
        with:
          name: release-controller-docker-${{ github.run_number }}
          path: release-assets
      - name: SHA256 checksums
        run: |
          cd release-assets
          find . -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # Semver prerelease tags (v1.0.0-alpha2) contain '-'; keep them off Latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
