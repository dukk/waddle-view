# Back-compat shim — use release-linux-desktop.yml with arch x64.
name: Release build — Linux x64

on:
  workflow_call:
    inputs:
      build_number:
        type: string
        required: true

jobs:
  build:
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-linux-desktop.yml
    with:
      arch: x64
      build_number: ${{ inputs.build_number }}
