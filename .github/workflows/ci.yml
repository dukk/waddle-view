name: CI — waddle_display

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - 'apps/waddle_display/**'
      - 'apps/waddle_display_mock_api/**'
      - 'apps/waddlectl/**'
      - 'packages/waddle_shared/**'
      - 'packages/waddle_integrations/**'
      - 'packages/waddle_plugin_sdk/**'
      - 'pubspec.yaml'
      - 'deploy/**'
      - 'docs/pi/**'
      - '.github/workflows/**'

defaults:
  run:
    working-directory: apps/waddle_display

permissions:
  contents: read

jobs:
  validate-linux-build-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ensure Linux build dependency list is complete
        run: |
          DEPS_FILE="$GITHUB_WORKSPACE/deploy/linux-arm64/build-deps.txt"
          test -f "$DEPS_FILE"
          for dep in clang lld-14 cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libmpv-dev; do
            grep -qx "$dep" "$DEPS_FILE"
          done
      - name: Ensure release workflows install Linux deps from shared list
        run: |
          for wf in release-pi release-linux-desktop; do
            f="$GITHUB_WORKSPACE/.github/workflows/${wf}.yml"
            test -f "$f"
            grep -q 'LINUX_BUILD_DEPS_FILE' "$f"
            # release-linux-x64: plain env path; release-pi (container): workspace-prefixed path
            grep -qE 'xargs -a "(\$GITHUB_WORKSPACE/)?\$LINUX_BUILD_DEPS_FILE"' "$f"
          done
      - name: Run deploy helper unit tests (pi-remote-upgrade)
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Validate install-latest-release.sh (bash syntax)
        run: bash -n "$GITHUB_WORKSPACE/deploy/install-latest-release.sh"
      - name: Validate linux-arm64 install.sh (bash syntax)
        run: bash -n "$GITHUB_WORKSPACE/deploy/linux-arm64/install.sh"

  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: validate-linux-build-deps
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waddle
          POSTGRES_PASSWORD: waddle
          POSTGRES_DB: waddle_display_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waddle -d waddle_display_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: ${{ github.workspace }}
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: ${{ github.workspace }}/packages/waddle_shared
      - run: flutter test --coverage --timeout=60s
        working-directory: ${{ github.workspace }}/packages/waddle_shared
        env:
          WADDLE_DISPLAY_TEST_DATABASE_URL: postgres://waddle:waddle@localhost:5432/waddle_display_test
      - run: dart test --coverage=coverage
        working-directory: ${{ github.workspace }}/packages/waddle_integrations
      - run: dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
        working-directory: ${{ github.workspace }}/packages/waddle_integrations
      - run: dart test --coverage=coverage
        working-directory: ${{ github.workspace }}/packages/waddle_plugin_sdk
      - run: dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
        working-directory: ${{ github.workspace }}/packages/waddle_plugin_sdk
      - run: flutter analyze
      - run: flutter test --coverage --timeout=60s
      - name: Line coverage (lib/)
        run: >
          dart run tool/coverage_check.dart --min=80 --target=90
          coverage/lcov.info
          ${{ github.workspace }}/packages/waddle_shared/coverage/lcov.info
          ${{ github.workspace }}/packages/waddle_plugin_sdk/coverage/lcov.info
      - run: flutter test
        working-directory: ${{ github.workspace }}/apps/waddlectl

  # Release-mode compile checks; run only after flutter analyze + tests pass (analyze-test).
  build-linux-x64:
    needs: analyze-test
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-linux-desktop.yml
    with:
      arch: x64
      build_number: ${{ github.run_number }}
      dist_basename: waddle-view-linux-x64-ci-run-${{ github.run_id }}-att-${{ github.run_attempt }}
      artifact_name: ci-bundle-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}

  build-linux-arm64-desktop:
    needs: analyze-test
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-linux-desktop.yml
    with:
      arch: arm64
      build_number: ${{ github.run_number }}
      dist_basename: waddle-view-linux-arm64-desktop-ci-run-${{ github.run_id }}-att-${{ github.run_attempt }}
      artifact_name: ci-bundle-linux-arm64-desktop-${{ github.run_id }}-${{ github.run_attempt }}

  build-windows-x64:
    needs: analyze-test
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-windows-desktop.yml
    with:
      arch: x64
      build_number: ${{ github.run_number }}
      dist_basename: waddle-view-windows-x64-ci-run-${{ github.run_id }}-att-${{ github.run_attempt }}
      artifact_name: ci-bundle-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}

  # Best-effort: continue-on-error is set inside release-windows-desktop for arch arm64.
  build-windows-arm64:
    needs: analyze-test
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-windows-desktop.yml
    with:
      arch: arm64
      build_number: ${{ github.run_number }}
      dist_basename: waddle-view-windows-arm64-ci-run-${{ github.run_id }}-att-${{ github.run_attempt }}
      artifact_name: ci-bundle-windows-arm64-${{ github.run_id }}-${{ github.run_attempt }}

  build-android:
    needs: analyze-test
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-android.yml
    with:
      build_number: ${{ github.run_number }}
      dist_basename: waddle-view-android-ci-run-${{ github.run_id }}-att-${{ github.run_attempt }}
      artifact_name: ci-bundle-android-${{ github.run_id }}-${{ github.run_attempt }}

  build-ios:
    needs: analyze-test
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-ios.yml
    with:
      build_number: ${{ github.run_number }}
      dist_basename: waddle-view-ios-ci-run-${{ github.run_id }}-att-${{ github.run_attempt }}
      artifact_name: ci-bundle-ios-${{ github.run_id }}-${{ github.run_attempt }}

  build-macos:
    needs: analyze-test
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-macos.yml
    with:
      build_number: ${{ github.run_number }}
      dist_basename: waddle-view-macos-ci-run-${{ github.run_id }}-att-${{ github.run_attempt }}
      artifact_name: ci-bundle-macos-${{ github.run_id }}-${{ github.run_attempt }}

  waddle-display-mock-api:
    runs-on: ubuntu-latest
    needs: validate-linux-build-deps
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/waddle_display_mock_api/package-lock.json
      - name: npm ci + build + lint (waddle_display_mock_api)
        working-directory: apps/waddle_display_mock_api
        run: npm ci && npm run build && npm run lint

  build-pi:
    needs: analyze-test
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/release-pi.yml
    with:
      build_number: ${{ github.run_number }}
      dist_basename: waddle-view-linux-arm64-ci-run-${{ github.run_id }}-att-${{ github.run_attempt }}
      artifact_name: ci-bundle-linux-arm64-${{ github.run_id }}-${{ github.run_attempt }}

  cleanup-ci-bundle-artifacts:
    runs-on: ubuntu-latest
    # No checkout — do not inherit workflow default cwd (apps/waddle_display).
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    needs:
      - analyze-test
      - waddle-display-mock-api
      - build-linux-x64
      - build-linux-arm64-desktop
      - build-windows-x64
      - build-windows-arm64
      - build-android
      - build-ios
      - build-macos
      - build-pi
    if: always() && !cancelled()
    permissions:
      actions: write
      contents: read
    steps:
      - name: Prune old CI bundle artifacts (keep newest 5 per platform)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json, os, subprocess, sys

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ.get("GH_TOKEN", "")
          if not token:
              print("No GH_TOKEN; skipping cleanup")
              sys.exit(0)

          prefixes = (
              "ci-bundle-linux-arm64-desktop-",
              "ci-bundle-linux-arm64-",
              "ci-bundle-linux-x64-",
              "ci-bundle-windows-x64-",
              "ci-bundle-windows-arm64-",
              "ci-bundle-android-",
              "ci-bundle-ios-",
              "ci-bundle-macos-",
          )
          keep = 5

          def list_artifacts():
              page = 1
              out = []
              while True:
                  raw = subprocess.check_output(
                      [
                          "gh",
                          "api",
                          f"/repos/{repo}/actions/artifacts?per_page=100&page={page}",
                      ],
                      text=True,
                  )
                  data = json.loads(raw)
                  batch = data.get("artifacts") or []
                  out.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return out

          def delete_artifact(aid: int):
              subprocess.check_call(
                  [
                      "gh",
                      "api",
                      "--method",
                      "DELETE",
                      f"/repos/{repo}/actions/artifacts/{aid}",
                  ],
              )

          try:
              all_arts = list_artifacts()
          except subprocess.CalledProcessError as e:
              print("Artifact list failed (non-fatal):", e)
              sys.exit(0)

          for prefix in prefixes:
              matching = [a for a in all_arts if a.get("name", "").startswith(prefix)]
              matching.sort(key=lambda a: a.get("created_at") or "", reverse=True)
              for a in matching[keep:]:
                  aid = a.get("id")
                  if aid is None:
                      continue
                  print("Deleting artifact", aid, a.get("name"))
                  try:
                      delete_artifact(int(aid))
                  except subprocess.CalledProcessError as e:
                      print("Delete failed:", e)
          PY
